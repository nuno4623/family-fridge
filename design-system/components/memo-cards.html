<!-- @dsCard group="캘린더 · 메모" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포스트잇 메모</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#FBFAF7;--card:#FFFFFF;--ink:#4A4238;--peach:#FFD9C8;--butter:#FFF3C4;--mint:#CDEBDD;--rose:#F9CFD6;--lavender:#DDD6F3;--sky:#CFE5F4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:700;border:none;min-width:88px;font-family:inherit;color:var(--ink)}
.btn{border:none;border-radius:12px;font-family:inherit;font-weight:700;font-size:16px;color:var(--ink);padding:14px 20px;cursor:pointer}
.dot{display:inline-block;width:12px;height:12px;border-radius:999px;flex-shrink:0}
.muted{color:rgba(74,66,56,.5)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
body{padding:24px}</style>
</head>
<body>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  
  <div style="background:var(--butter);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px 16px 12px;position:relative">
    <span style="position:absolute;top:8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:999px;background:var(--rose);border:2px solid rgba(255,255,255,.8);box-shadow:0 1px 2px rgba(0,0,0,.15)"></span>
    <span style="position:absolute;top:6px;right:8px;font-size:14px">📌</span>
    <div style="font-size:16px">분리수거는 목요일 아침! 🗑</div>
    <div class="muted" style="font-size:12px;margin-top:8px">지선 · 3일 전</div>
  </div>
  <div style="background:var(--rose);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px 16px 12px;position:relative">
    <span style="position:absolute;top:8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:999px;background:var(--mint);border:2px solid rgba(255,255,255,.8);box-shadow:0 1px 2px rgba(0,0,0,.15)"></span>
    
    <div style="font-size:16px">고등어 손질해서 냉동칸에</div>
    <div class="muted" style="font-size:12px;margin-top:8px">어머님 · 6시간 전</div>
  </div>
  <div style="background:var(--mint);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px 16px 12px;position:relative">
    <span style="position:absolute;top:8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:999px;background:var(--rose);border:2px solid rgba(255,255,255,.8);box-shadow:0 1px 2px rgba(0,0,0,.15)"></span>
    
    <div style="font-size:16px">주말에 다 같이 장보러 가요~</div>
    <div class="muted" style="font-size:12px;margin-top:8px">지선 · 1일 전</div>
  </div>
  <div style="background:var(--lavender);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px 16px 12px;position:relative">
    <span style="position:absolute;top:8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:999px;background:var(--sky);border:2px solid rgba(255,255,255,.8);box-shadow:0 1px 2px rgba(0,0,0,.15)"></span>
    
    <div style="font-size:16px">정수기 필터 교체 예약함</div>
    <div class="muted" style="font-size:12px;margin-top:8px">준호 · 1일 전</div>
  </div>
</div>
</body>
</html>
