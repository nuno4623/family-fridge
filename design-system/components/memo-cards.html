<!-- @dsCard group="메모" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포스트잇 메모</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF3EE;--alt:#F5EDE7;--surface:#FFFFFF;--text:#1B2740;--muted:#8C96A8;
--accent:#FF6B35;--accent-deep:#E8551F;--accent-soft:#FFE2D4;--line:#F0E6DE;
--good:#2E9E5B;--warn:#F2A81D;--danger:#F0524B;
--shadow:0 12px 30px rgba(255,107,53,.14)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Gothic A1',-apple-system,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
.card{background:var(--surface);border-radius:18px;border:1px solid var(--line);box-shadow:var(--shadow)}
.badge{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:5px 10px;font-size:12px;font-weight:800;color:#fff;border:none;white-space:nowrap}
.btn{border:none;border-radius:16px;font-family:inherit;font-weight:800;font-size:15.5px;color:#fff;background:var(--accent);padding:15px 20px;cursor:pointer;box-shadow:0 8px 20px rgba(255,107,53,.4)}
.tile{width:44px;height:44px;border-radius:13px;background:var(--alt);display:grid;place-items:center;font-size:23px;flex-shrink:0}
.muted{color:var(--muted)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:10px}
body{padding:24px}</style>
</head>
<body>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  
  <div style="background:#FFF3C4;border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px 16px 12px;position:relative;color:#4A4238">
    <span style="position:absolute;top:8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:99px;background:#E08A5B;border:2px solid rgba(255,255,255,.8);box-shadow:0 1px 2px rgba(0,0,0,.15)"></span>
    <span style="position:absolute;top:6px;right:8px;font-size:14px">📌</span>
    <div style="font-size:14.5px;font-weight:600">분리수거는 목요일 아침! 🗑</div>
    <div style="font-size:11.5px;font-weight:600;opacity:.5;margin-top:8px">지선 · 3일 전</div>
  </div>
  <div style="background:#F9CFD6;border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px 16px 12px;position:relative;color:#4A4238">
    <span style="position:absolute;top:8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:99px;background:#16A97A;border:2px solid rgba(255,255,255,.8);box-shadow:0 1px 2px rgba(0,0,0,.15)"></span>
    
    <div style="font-size:14.5px;font-weight:600">고등어 손질해서 냉동칸에</div>
    <div style="font-size:11.5px;font-weight:600;opacity:.5;margin-top:8px">어머님 · 6시간 전</div>
  </div>
  <div style="background:#CDEBDD;border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px 16px 12px;position:relative;color:#4A4238">
    <span style="position:absolute;top:8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:99px;background:#E08A5B;border:2px solid rgba(255,255,255,.8);box-shadow:0 1px 2px rgba(0,0,0,.15)"></span>
    
    <div style="font-size:14.5px;font-weight:600">주말에 다 같이 장보러 가요~</div>
    <div style="font-size:11.5px;font-weight:600;opacity:.5;margin-top:8px">지선 · 1일 전</div>
  </div>
  <div style="background:#DDD6F3;border-radius:18px;box-shadow:0 1px 3px rgba(0,0,0,.06);padding:20px 16px 12px;position:relative;color:#4A4238">
    <span style="position:absolute;top:8px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:99px;background:#2E6BFF;border:2px solid rgba(255,255,255,.8);box-shadow:0 1px 2px rgba(0,0,0,.15)"></span>
    
    <div style="font-size:14.5px;font-weight:600">정수기 필터 교체 예약함</div>
    <div style="font-size:11.5px;font-weight:600;opacity:.5;margin-top:8px">준호 · 1일 전</div>
  </div>
</div>
</body>
</html>
