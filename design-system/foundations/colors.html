<!-- @dsCard group="파운데이션" -->
<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>컬러 토큰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--bg:#FBFAF7;--card:#FFFFFF;--ink:#4A4238;--peach:#FFD9C8;--butter:#FFF3C4;--mint:#CDEBDD;--rose:#F9CFD6;--lavender:#DDD6F3;--sky:#CFE5F4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.pill{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;padding:10px 16px;font-size:15px;font-weight:700;border:none;min-width:88px;font-family:inherit;color:var(--ink)}
.btn{border:none;border-radius:12px;font-family:inherit;font-weight:700;font-size:16px;color:var(--ink);padding:14px 20px;cursor:pointer}
.dot{display:inline-block;width:12px;height:12px;border-radius:999px;flex-shrink:0}
.muted{color:rgba(74,66,56,.5)}
.row{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column;gap:12px}
body{padding:24px}</style>
</head>
<body>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
  
  <div class="card" style="overflow:hidden">
    <div style="height:56px;background:#FBFAF7;"></div>
    <div style="padding:10px 12px">
      <div style="font-weight:700;font-size:14px">--bg</div>
      <div class="muted" style="font-size:12px">#FBFAF7 · 배경 · 냉장고 문</div>
    </div>
  </div>
  <div class="card" style="overflow:hidden">
    <div style="height:56px;background:#FFFFFF;border-bottom:1px solid rgba(74,66,56,.08)"></div>
    <div style="padding:10px 12px">
      <div style="font-weight:700;font-size:14px">--card</div>
      <div class="muted" style="font-size:12px">#FFFFFF · 카드 · 종이</div>
    </div>
  </div>
  <div class="card" style="overflow:hidden">
    <div style="height:56px;background:#4A4238;"></div>
    <div style="padding:10px 12px">
      <div style="font-weight:700;font-size:14px">--ink</div>
      <div class="muted" style="font-size:12px">#4A4238 · 글자 (순검정 금지)</div>
    </div>
  </div>
  <div class="card" style="overflow:hidden">
    <div style="height:56px;background:#FFD9C8;"></div>
    <div style="padding:10px 12px">
      <div style="font-weight:700;font-size:14px">--peach</div>
      <div class="muted" style="font-size:12px">#FFD9C8 · 주 액센트 · CTA</div>
    </div>
  </div>
  <div class="card" style="overflow:hidden">
    <div style="height:56px;background:#FFF3C4;"></div>
    <div style="padding:10px 12px">
      <div style="font-weight:700;font-size:14px">--butter</div>
      <div class="muted" style="font-size:12px">#FFF3C4 · 포스트잇 · '곧 떨어짐'</div>
    </div>
  </div>
  <div class="card" style="overflow:hidden">
    <div style="height:56px;background:#CDEBDD;"></div>
    <div style="padding:10px 12px">
      <div style="font-weight:700;font-size:14px">--mint</div>
      <div class="muted" style="font-size:12px">#CDEBDD · '충분' · 성공</div>
    </div>
  </div>
  <div class="card" style="overflow:hidden">
    <div style="height:56px;background:#F9CFD6;"></div>
    <div style="padding:10px 12px">
      <div style="font-weight:700;font-size:14px">--rose</div>
      <div class="muted" style="font-size:12px">#F9CFD6 · '떨어짐' · 멤버1</div>
    </div>
  </div>
  <div class="card" style="overflow:hidden">
    <div style="height:56px;background:#DDD6F3;"></div>
    <div style="padding:10px 12px">
      <div style="font-weight:700;font-size:14px">--lavender</div>
      <div class="muted" style="font-size:12px">#DDD6F3 · 캘린더 · 멤버2</div>
    </div>
  </div>
  <div class="card" style="overflow:hidden">
    <div style="height:56px;background:#CFE5F4;"></div>
    <div style="padding:10px 12px">
      <div style="font-weight:700;font-size:14px">--sky</div>
      <div class="muted" style="font-size:12px">#CFE5F4 · 멤버3</div>
    </div>
  </div>
</div>
</body>
</html>
